name: CI
on:
  push:
    branches:
      - main
  pull_request:
# Enable manual execution via the GitHub Actions UI
  workflow_dispatch:
    inputs:
      scope:
        description: 'Choose execution scope (all or affected)'
        required: true
        default: 'affected'
        type: choice
        options:
          - affected
          - all

#  Cancel out-of-date runs if a developer pushes new commits to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read # Required by nrwl/nx-set-shas on PR events

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/walletos_test
      DIRECT_URL: postgresql://postgres:password@localhost:5432/walletos_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: walletos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0 is required for Nx to accurately track git diffs for 'affected' execution.
          # Do not combine with filter: tree:0 — they are mutually exclusive; tree:0 is ignored
          # during a full clone and causes a warning.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Database Port Connection
        run: |
          until nc -z localhost 5432; do
            echo "Waiting for PostgreSQL engine to spin up..."
            sleep 1
          done

      - name: Generate Prisma Client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Sync Test Database
        run: npx prisma db push --schema=apps/api/prisma/schema.prisma --force-reset

      # Establish SHAs for target execution tracking
      - name: Derive Base and Head SHAs for Nx
        uses: nrwl/nx-set-shas@v5
      # Use smart-gating to process code updates efficiently.
      # On push/pull_request events, github.event.inputs.scope is empty, so
      # the else branch runs automatically — defaulting to 'affected' mode.
      - name: Run Lint Checks
        run: |
          if [ "${{ github.event.inputs.scope }}" = "all" ]; then
            npx nx run-many -t lint --max-warnings=200
          else
            npx nx affected -t lint --max-warnings=200
          fi

      - name: Run Build Architecture Verification
        run: |
          if [ "${{ github.event.inputs.scope }}" = "all" ]; then
            npx nx run-many -t build
          else
            npx nx affected -t build
          fi

      - name: Run Test Suite Execution
        run: |
          if [ "${{ github.event.inputs.scope }}" = "all" ]; then
            # --parallel=1 prevents Nx from launching multiple projects concurrently,
            # which would cause race conditions on the shared test database.
            npx nx run-many -t test --parallel=1 --runInBand --silent
          else
            npx nx affected -t test --parallel=1 --runInBand --silent
          fi